name: sensor_reading
description: "Wearables companion demo: 200 Hz synthetic sensor streamed through sensor_hub."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  fl_chart: ^1.2.0
  # The sensor module: one package (Dart API + Android native code).
  sensor_hub:
    path: packages/sensor_hub

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
